
name: Cinema Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności frontendu
        working-directory: frontend
        run: npm ci

      - name: Budowanie frontendu
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalacja zależności backendu
        working-directory: backend
        run: npm ci

      - name: Sprawdzenie składni backendu
        working-directory: backend
        run: node --check server.js
