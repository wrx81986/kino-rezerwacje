
name: Cinema Project CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności frontendu
        working-directory: frontend
        run: npm ci

      - name: Budowanie frontendu
        working-directory: frontend
        run: npm run build

      - name: Sprawdzenie jakości kodu frontendu
        working-directory: frontend
        run: npm run lint

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalacja zależności backendu
        working-directory: backend
        run: npm ci

      - name: Testy backendu
        working-directory: backend
        run: npm test

      - name: Sprawdzenie składni backendu
        working-directory: backend
        run: node --check server.js

  deploy:
    name: Deploy to Google Cloud
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Autoryzacja Google Cloud przez OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Konfiguracja Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Konfiguracja Docker dla Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev --quiet

      - name: Budowanie obrazu backendu
        run: |
          docker build -t europe-central2-docker.pkg.dev/kino-rezerwacje/kino-rezerwacje/kino-backend:${{ github.sha }} ./backend

      - name: Wysyłanie obrazu backendu
        run: |
          docker push europe-central2-docker.pkg.dev/kino-rezerwacje/kino-rezerwacje/kino-backend:${{ github.sha }}

      - name: Wdrożenie backendu na Cloud Run
        run: |
          gcloud run deploy kino-backend \
            --image=europe-central2-docker.pkg.dev/kino-rezerwacje/kino-rezerwacje/kino-backend:${{ github.sha }} \
            --region=europe-central2 \
            --project=kino-rezerwacje \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=kino-backend-runtime@kino-rezerwacje.iam.gserviceaccount.com \
            --network=kino-vpc \
            --subnet=kino-app-subnet \
            --vpc-egress=private-ranges-only \
            --update-env-vars=DB_SSL=true \
            --min=0 \
            --max=3

      - name: Konfiguracja Node.js dla frontendu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja zależności frontendu
        working-directory: frontend
        run: npm ci

      - name: Budowanie frontendu dla produkcji
        working-directory: frontend
        env:
          VITE_API_URL: https://kino-backend-142480704354.europe-central2.run.app/api
        run: npm run build

      - name: Wdrożenie frontendu na Firebase Hosting
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project=kino-rezerwacje --non-interactive
